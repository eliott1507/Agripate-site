  <script>
    (function () {
      const CYCLE = 2.4;
      const LOOP = 14.4;
      const N = 6;
      const tl = gsap.timeline({ paused: true });
      const after = { immediateRender: false };

      // Fond : couronne de pattes en rotation lente (10 pattes, 72° par boucle = raccord parfait)
      tl.fromTo("#ring-spin", { rotation: 0 }, { rotation: 72, duration: LOOP, ease: "none" }, 0);

      function leave(p, s) {
        tl.fromTo(["#h" + p + "-use", "#h" + p + "-price"], { scale: 1 }, { scale: 0, duration: 0.2, ease: "power3.in", ...after }, s);
        tl.fromTo("#h" + p + "-name span", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.012, ease: "power2.in", ...after }, s + 0.05);
        tl.fromTo("#h" + p + "-count", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.15, ...after }, s + 0.2);
        tl.fromTo("#h" + p + "-sockwrap", { x: 0, rotation: 0, filter: "blur(0px)" }, { x: -1250, rotation: -24, filter: "blur(14px)", duration: 0.38, ease: "power3.in", ...after }, s + 0.12);
      }

      function arrive(i, s) {
        tl.fromTo("#bg" + i, { clipPath: "circle(0% at 50% 62%)" }, { clipPath: "circle(86% at 50% 62%)", duration: 0.45, ease: "power2.inOut" }, s + 0.26);
        tl.fromTo("#h" + i + "-shadow", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "power2.in" }, s + 0.3);
        tl.fromTo("#h" + i + "-sock", { y: -1150, rotation: 16 }, { y: 0, rotation: -4, duration: 0.36, ease: "power2.in" }, s + 0.3);
        tl.fromTo("#h" + i + "-sock", { scaleX: 1, scaleY: 1 }, { scaleX: 1.13, scaleY: 0.86, duration: 0.07, ease: "power2.out", ...after }, s + 0.66);
        tl.fromTo("#h" + i + "-sock", { scaleX: 1.13, scaleY: 0.86, rotation: -4 }, { scaleX: 1, scaleY: 1, rotation: 0, duration: 0.32, ease: "elastic.out(1, 0.45)", ...after }, s + 0.73);
        const letters = document.querySelectorAll("#h" + i + "-name span");
        tl.fromTo(letters, { opacity: 0, y: 50, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, stagger: Math.min(0.03, 0.26 / letters.length), ease: "expo.out" }, s + 0.5);
        tl.fromTo("#h" + i + "-count", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, s + 0.55);
        tl.fromTo("#h" + i + "-use", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, s + 0.7);
        tl.fromTo("#h" + i + "-price", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)" }, s + 0.74);
      }

      // La 1re paire est déjà posée à 0 s ; chaque transition dure 1,1 s et se termine pile sur le cycle suivant.
      for (let i = 1; i <= N; i++) {
        const s = CYCLE * i - 1.1;
        leave(i - 1, s);
        arrive(i, s);
      }

      window.__timelines["defile"] = tl;
    })();
  </script>
