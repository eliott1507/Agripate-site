<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./catalogue.js"></script><script src="./fun.js"></script></helmet>
<header style="display:flex;align-items:center;gap:16px;padding:22px clamp(16px,4vw,48px) 16px;flex-wrap:wrap;font-family:'Nunito',system-ui,sans-serif;color:#3b2a26">
  <a href="Accueil.dc.html" data-fun="miaou" style="position:relative;margin-right:auto;padding:10px 20px 8px;background:#3b2a26;color:#fff6ea;border-radius:999px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.01em;text-decoration:none">
    <span style="position:absolute;left:14px;top:-12px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid #3b2a26"></span>
    <span style="position:absolute;right:14px;top:-12px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid #3b2a26"></span>
    Agripatte
  </a>
  <nav style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700;font-size:15px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="{{ it.href }}" style="padding:10px 16px;border-radius:999px;text-decoration:none;background:{{ it.bg }};color:{{ it.fg }}" style-hover="background:#ffe3d6;color:#a23a1c">{{ it.label }}</a>
    </sc-for>
    <a href="Panier.dc.html" style="display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-radius:999px;background:#fff;border:2px solid #3b2a26;color:#3b2a26;text-decoration:none" style-hover="background:#fff1e8;color:#3b2a26">Panier <span data-cart-badge="1" style="min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:#ff7a59;color:#fff;display:grid;place-items:center;font-size:13px">{{ count }}</span></a>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;produits&quot;,&quot;conseils&quot;,&quot;apropos&quot;,&quot;faq&quot;,&quot;panier&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.up = () => this.forceUpdate();
    window.addEventListener('agri-cart', this.up); window.addEventListener('storage', this.up);
    const t = () => window.AGRI ? this.forceUpdate() : setTimeout(t, 50); t();
  }
  componentWillUnmount() { window.removeEventListener('agri-cart', this.up); window.removeEventListener('storage', this.up); }
  renderVals() {
    const A = window.AGRI, a = this.props.active;
    const nav = [['accueil', 'Accueil', 'Accueil.dc.html'], ['produits', 'Chaussettes', A ? A.PRODUIT : 'Agripatte%20Fiches%20Produit%20v2.dc.html'], ['conseils', 'Conseils', 'Conseils.dc.html'], ['apropos', 'À propos', 'A-propos.dc.html'], ['faq', 'FAQ', 'FAQ.dc.html']];
    return {
      count: A ? A.count() : 0,
      items: nav.map(([k, label, href]) => ({ label, href, bg: k === a ? '#ffd9cc' : 'transparent', fg: k === a ? '#a23a1c' : '#3b2a26' }))
    };
  }
}
</script>
</body>
</html>
